---
 - name: Configure Jenkins on AMZ2
   remote_user: ec2-user
   become: yes
   become_method: sudo

   hosts: all

   roles:
    - role: lean_delivery.java
      vars:
        - java_package: jre
        - java_major_version: 8
        - transport: repositories

    - role: lean_delivery.jenkins

    - role: diodonfrost.terraform
      vars:
        - terraform_version: 0.11.14

    - role: andrewrothstein.packer

    - role: undergreen.prometheus-node-exporter
      vars:
        - prometheus_node_exporter_version: 0.18.1
        - prometheus_node_exporter_enabled_collectors:
            - conntrack
            - cpu
            - diskstats
            - entropy
            - filefd
            - filesystem
            - loadavg
            - mdadm
            - meminfo
            - netdev
            - netstat
            - stat
            - textfile
            - time
            - vmstat
        - prometheus_node_exporter_config_flags:
            'web.listen-address': '0.0.0.0:9113'
            'log.level': 'info'

   tasks:
    - name: Install Python-Boto packages
      package:
        name: "python-boto"
        state: present
