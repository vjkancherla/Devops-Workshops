---

- name: Update Monitoring tools' config files
  remote_user: ec2-user
  become: yes
  become_method: sudo

  hosts: localhost
  connection: local 

- tasks:
  - name: Copy elasticsearch config file
    template:
      src: elasticsearch.yml.j2
      dest: /etc/elasticsearch/elasticsearch.yml
    notify: restart elasticsearch

  - name: Copy Kibana config file
    template:
      src: kibana.yml.j2
      dest: /etc/kibana/kibana.yml
    notify: restart kibana

  - name: Copy Filebeat config file
    template:
      src: filebeat.yml.j2
      dest: /etc/filebeat/filebeat.yml
    notify: restart filebeat

  - name: Copy Metricbeat config file
    template:
      src: metricbeat.yml.j2
      dest: /etc/metricbeat/metricbeat.yml
    notify: restart metricbeat

  #any queued up handlers would be processed immediately, instead of at the end of the Play
  - meta: flush_handlers

  - name: Wait for port 9200 to become open on the host, don't start checking for 10 seconds
    wait_for:
      host: "{{ ansible_default_ipv4.address }}"
      port: 9200
      delay: 10

  - name: Run Filebeat 'setup' command
    shell: "filebeat setup"
    notify: restart filebeat

  - name: Run Metricbeat 'setup' command
    shell: "metricbeat setup"
    notify: restart metricbeat

- handlers:
  - name: My handlers
    include: handlers/main.yml
